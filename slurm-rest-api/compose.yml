x-slurm-image: &slurm-image giovtorres/slurm-docker-cluster:25.11.4

services:
  mariadb:
    image: mariadb:12
    hostname: mysql
    environment:
      - MARIADB_DATABASE=slurm_acct_db
      - MARIADB_USER=slurm
      - MARIADB_PASSWORD=${SLURM_DB_PASSWORD:-changeme-slurm-db}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-changeme-mariadb-root}
    volumes:
      - var_lib_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p\"${MARIADB_ROOT_PASSWORD:-changeme-mariadb-root}\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    restart: unless-stopped

  slurmdbd:
    image: *slurm-image
    command: ["slurmdbd"]
    hostname: slurmdbd
    environment:
      - MYSQL_USER=slurm
      - MYSQL_PASSWORD=${SLURM_DB_PASSWORD:-changeme-slurm-db}
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof slurmdbd"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  slurmctld:
    image: *slurm-image
    command: ["slurmctld"]
    hostname: slurmctld
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
      - slurm_jobdir:/data
    depends_on:
      slurmdbd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "scontrol ping >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  slurmd:
    image: *slurm-image
    command: ["slurmd-cpu"]
    # slurmd needs SYS_ADMIN for cgroup management; the giovtorres image
    # documents privileged: true as the supported configuration.
    privileged: true
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
      - slurm_jobdir:/data
    depends_on:
      slurmctld:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof slurmd"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  # slurmrestd runs as its own service so the conoha proxy can expose only :6820
  # without binding the cluster's internal ports.
  slurmrestd:
    image: *slurm-image
    command: ["slurmrestd"]
    hostname: slurmrestd
    # slurmrestd calls unshare() for namespace isolation per request, which
    # needs SYS_ADMIN. giovtorres ships privileged: true as the supported config.
    privileged: true
    expose:
      - "6820"
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
    depends_on:
      slurmctld:
        condition: service_healthy
    restart: unless-stopped

volumes:
  var_lib_mysql:
  etc_munge:
  etc_slurm:
  var_log_slurm:
  slurm_jobdir:
