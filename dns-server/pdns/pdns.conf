launch=gpgsql
gpgsql-host=127.0.0.1
gpgsql-port=5432
gpgsql-dbname=pdns
gpgsql-user=pdns
# gpgsql-password is overridden via `--gpgsql-password=` in compose.yml so
# `${POSTGRES_PASSWORD}` flows through. The value here is just a fallback
# for ad-hoc `docker run` and matches the compose default.
gpgsql-password=pdns
local-address=0.0.0.0
local-port=53
# Cache TTLs trimmed from the upstream defaults (query=20s, neg=60s) so
# new subdomains become resolvable within ~10s of POST and DELETE clears
# negative cache promptly. PowerDNS still guards the backend via gpgsql
# query cache; tune these up if you want lower DB load and can tolerate
# slower propagation.
query-cache-ttl=10
negquery-cache-ttl=10
# HTTP API disabled. v1 has no use for it and it would be reachable on the
# VPS host's loopback (network_mode: host), bypassing the FastAPI Bearer
# auth layer. Use `docker compose exec pdns pdnsutil ...` for debugging.
api=no
disable-axfr=yes
log-dns-queries=no
loglevel=4
