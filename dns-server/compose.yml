services:
  app:
    build: .
    expose:
      - "8080"
    environment:
      - DATABASE_URL=postgres://pdns:${POSTGRES_PASSWORD:-pdns}@db:5432/pdns
      - PARENT_ZONE=${PARENT_ZONE:-users.example.com}
      - ENV=${ENV:-prod}
    depends_on:
      pdns-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

  # network_mode: host so PowerDNS owns :53 directly. Side effect:
  # the host-net container can NOT resolve 'db' via Docker DNS, so
  # we point pdns.conf at 127.0.0.1:5432 and bind-publish db's port
  # to localhost only.
  pdns:
    image: powerdns/pdns-auth-49:4.9.14
    # user: "0:0" — image's default user (pdns) loses CAP_NET_BIND_SERVICE
    # on exec, so binding :53 fails with EACCES. Running as root is fine here:
    # the host-network mode already shares the host's network namespace, and
    # the only listener exposed is pdns_server itself.
    user: "0:0"
    network_mode: host
    # PowerDNS doesn't interpolate env vars in pdns.conf, so we override the
    # one secret (gpgsql-password) on the command line — compose substitutes
    # ${POSTGRES_PASSWORD} before exec, keeping pdns.conf free of secrets.
    command:
      - "--gpgsql-password=${POSTGRES_PASSWORD:-pdns}"
    volumes:
      - ./pdns/pdns.conf:/etc/powerdns/pdns.conf:ro
    depends_on:
      pdns-init:
        condition: service_completed_successfully
    restart: unless-stopped

  pdns-init:
    build: ./pdns-init
    environment:
      - DATABASE_URL=postgres://pdns:${POSTGRES_PASSWORD:-pdns}@db:5432/pdns
      - PARENT_ZONE=${PARENT_ZONE:-users.example.com}
      - PRIMARY_NS=${PRIMARY_NS:-ns1.example.com.}
      - SOA_EMAIL=${SOA_EMAIL:-admin.example.com.}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=pdns
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pdns}
      - POSTGRES_DB=pdns
    ports:
      # 127.0.0.1 only — pdns (host net) reaches db at localhost:5432.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdns"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
