apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    developerConfiguration:
      # Fallback for hosts WITHOUT /dev/kvm: software emulation (QEMU TCG),
      # 10-100x slower. Not needed on ConoHa VPS3 (which has /dev/kvm).
      useEmulation: true
