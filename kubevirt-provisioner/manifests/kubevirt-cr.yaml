apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  # ConoHa VPS3 exposes /dev/kvm (verified — see SPIKE_NOTES.md), so KubeVirt
  # uses HARDWARE KVM acceleration. Leave useEmulation unset.
  # On a host WITHOUT /dev/kvm, apply manifests/kubevirt-cr-emulation.yaml
  # instead (software emulation; 10-100x slower).
  configuration: {}
