[project]
name = "opencascade-fem"
version = "0.1.0"
description = "OpenCascade + scikit-fem linear-elasticity demo on ConoHa VPS3"
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "asgi-lifespan>=2",
    "anyio>=4",
]

[tool.pytest.ini_options]
markers = ["slow: end-to-end tests"]
addopts = "-q"
