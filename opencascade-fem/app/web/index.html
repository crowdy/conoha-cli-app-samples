<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>opencascade-fem</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:,">
<script type="importmap">
{
  "imports": {
    "@kitware/vtk.js/Rendering/Misc/FullScreenRenderWindow.js": "https://ga.jspm.io/npm:@kitware/vtk.js@30.10.0/Rendering/Misc/FullScreenRenderWindow.js",
    "@kitware/vtk.js/IO/XML/XMLPolyDataReader.js": "https://ga.jspm.io/npm:@kitware/vtk.js@30.10.0/IO/XML/XMLPolyDataReader.js",
    "@kitware/vtk.js/Rendering/Core/Actor.js": "https://ga.jspm.io/npm:@kitware/vtk.js@30.10.0/Rendering/Core/Actor.js",
    "@kitware/vtk.js/Rendering/Core/Mapper.js": "https://ga.jspm.io/npm:@kitware/vtk.js@30.10.0/Rendering/Core/Mapper.js",
    "@kitware/vtk.js/Rendering/Core/ColorTransferFunction.js": "https://ga.jspm.io/npm:@kitware/vtk.js@30.10.0/Rendering/Core/ColorTransferFunction.js"
  },
  "scopes": {
    "https://ga.jspm.io/": {
      "crypto": "https://ga.jspm.io/npm:@jspm/core@2.1.0/nodelibs/browser/crypto.js",
      "define-data-property": "https://ga.jspm.io/npm:define-data-property@1.1.4/index.js",
      "define-properties": "https://ga.jspm.io/npm:define-properties@1.2.1/index.js",
      "es-define-property": "https://ga.jspm.io/npm:es-define-property@1.0.1/index.js",
      "es-errors/syntax": "https://ga.jspm.io/npm:es-errors@1.3.0/syntax.js",
      "es-errors/type": "https://ga.jspm.io/npm:es-errors@1.3.0/type.js",
      "fast-deep-equal": "https://ga.jspm.io/npm:fast-deep-equal@3.1.3/index.js",
      "fflate": "https://ga.jspm.io/npm:fflate@0.7.3/esm/browser.js",
      "gl-matrix": "https://ga.jspm.io/npm:gl-matrix@3.4.3/esm/index.js",
      "globalthis": "https://ga.jspm.io/npm:globalthis@1.0.3/index.js",
      "gopd": "https://ga.jspm.io/npm:gopd@1.2.0/index.js",
      "has-property-descriptors": "https://ga.jspm.io/npm:has-property-descriptors@1.0.2/index.js",
      "object-keys": "https://ga.jspm.io/npm:object-keys@1.1.1/index.js",
      "seedrandom": "https://ga.jspm.io/npm:seedrandom@3.0.5/index.js",
      "spark-md5": "https://ga.jspm.io/npm:spark-md5@3.0.2/spark-md5.js",
      "xmlbuilder2": "https://cdn.jsdelivr.net/npm/xmlbuilder2@4.0.3/+esm"
    }
  }
}
</script>
</head>
<body>
<header>
  <h1>opencascade-fem</h1>
  <p>OpenCascade → gmsh → scikit-fem → vtk.js — linear elasticity demo</p>
</header>
<main>
  <aside id="controls">
    <label>Shape
      <select id="shape"></select>
    </label>
    <div id="params"></div>
    <fieldset>
      <legend>Material</legend>
      <label>E (GPa) <input type="number" id="E" value="200" min="1" step="1"></label>
      <label>ν <input type="number" id="nu" value="0.3" min="0" max="0.49" step="0.01"></label>
    </fieldset>
    <label>Traction (MPa) <input type="number" id="traction" value="10" min="0" step="1"></label>
    <label>Mesh size <input type="number" id="mesh_size" value="8" min="0.5" step="0.5"></label>
    <button id="run">Run</button>
    <progress id="progress" value="0" max="6"></progress>
    <pre id="log"></pre>

    <fieldset>
      <legend>View</legend>
      <label>Field
        <select id="field">
          <option value="displacement_magnitude">displacement</option>
          <option value="von_mises" selected>von Mises</option>
        </select>
      </label>
      <label>Warp <input type="range" id="warp" min="0" max="200" value="50"></label>
    </fieldset>
  </aside>
  <section id="canvas"></section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
